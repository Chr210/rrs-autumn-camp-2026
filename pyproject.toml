[project]
name = "rrs-autumn-camp-2026"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".local", "submissions", "starter"]
cache-dir = ".local/cache/ruff"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
cache_dir = ".local/cache/pytest"
testpaths = ["tests"]
